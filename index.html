<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUD Client</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background-color: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: 10px;
    }

    header {
      text-align: center;
      padding: 10px 0;
      border-bottom: 1px solid #333;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.5rem;
      color: #4CAF50;
    }

    #game-output {
      flex: 1;
      background-color: #0a0a0a;
      border: 1px solid #333;
      border-radius: 5px;
      padding: 15px;
      overflow-y: auto;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    #game-output .system-message {
      color: #ff9800;
    }

    #game-output .error-message {
      color: #f44336;
    }

    #game-output .player-command {
      color: #2196F3;
    }

    #game-output .server-response {
      color: #e0e0e0;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #command-input {
      flex: 1;
      background-color: #0a0a0a;
      border: 1px solid #333;
      border-radius: 5px;
      padding: 12px;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      outline: none;
    }

    #command-input:focus {
      border-color: #4CAF50;
    }

    #send-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 12px 24px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      transition: background-color 0.3s;
    }

    #send-btn:hover {
      background-color: #45a049;
    }

    #send-btn:disabled {
      background-color: #333;
      cursor: not-allowed;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 30px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .modal h2 {
      color: #4CAF50;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #e0e0e0;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      background-color: #0a0a0a;
      border: 1px solid #333;
      border-radius: 5px;
      padding: 12px;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #4CAF50;
    }

    #connect-btn {
      width: 100%;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 12px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    #connect-btn:hover {
      background-color: #45a049;
    }

    #connect-btn:disabled {
      background-color: #333;
      cursor: not-allowed;
    }

    .connection-status {
      text-align: center;
      padding: 5px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .connected {
      color: #4CAF50;
    }

    .disconnected {
      color: #f44336;
    }

    .connecting {
      color: #ff9800;
    }

    #reconnect-btn {
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 8px 16px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }

    #reconnect-btn:hover {
      background-color: #1976D2;
    }
  </style>
</head>
<body>
  <!-- Connection Modal -->
  <div id="connection-modal" class="modal-overlay">
    <div class="modal">
      <h2>Подключение к MUD серверу</h2>
      <form id="connection-form">
        <div class="form-group">
          <label for="server-address">Адрес сервера:</label>
          <input 
            type="text" 
            id="server-address" 
            placeholder="example.com или 127.0.0.1" 
            required
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label for="server-port">Порт:</label>
          <input 
            type="number" 
            id="server-port" 
            placeholder="4000" 
            min="1" 
            max="65535"
            required
            autocomplete="off"
          />
        </div>
        <button type="submit" id="connect-btn">Подключиться</button>
      </form>
    </div>
  </div>

  <!-- Main Application -->
  <div class="container">
    <header>
      <h1>🎮 MUD Client</h1>
      <div id="connection-status" class="connection-status"></div>
      <button id="reconnect-btn">Переподключиться</button>
    </header>

    <div id="game-output"></div>

    <div class="input-area">
      <input 
        type="text" 
        id="command-input" 
        placeholder="Введите команду..." 
        autocomplete="off"
        disabled
      />
      <button id="send-btn" disabled>Отправить</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
